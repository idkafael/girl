name: painel

on:
  push:
    branches: [main]
    paths: ["painel/**", ".github/workflows/painel.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - name: Instala o Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: painel
      - name: Compila o .exe
        run: cargo build --release
      - name: Monta o pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\GirlPainel.exe dist\
          Copy-Item LEIA-ME.txt dist\
          Compress-Archive -Path dist\* -DestinationPath GirlPainel.zip -Force
      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: GirlPainel
          path: painel/GirlPainel.zip
      - name: Publica o Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-latest
          name: Girl Painel (ultima versao)
          body: "Baixe o GirlPainel.zip, extraia e rode o GirlPainel.exe. Sem instalacao."
          files: |
            painel/GirlPainel.zip
            painel/target/release/GirlPainel.exe
