[package]
name = "girl-painel"
version = "0.1.0"
edition = "2021"
description = "Painel da Girl Agência: um navegador isolado por criadora"

[[bin]]
name = "GirlPainel"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
